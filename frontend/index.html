<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Sameframe</title>
    <script>
    // Pre-paint theme (must mirror settings.svelte.ts): explicit choice wins,
    // else system preference. Prevents a light flash in dark mode.
    {
      const t = localStorage.getItem("sameframe-theme")
      const theme = t === "light" || t === "dark"
        ? t
        : matchMedia("(prefers-color-scheme: light)").matches
        ? "light"
        : "dark"
      document.documentElement.dataset.theme = theme
      // Safari tints its chrome from theme-color; without it, it samples the
      // page and lands on white. Values mirror --bg in app.css.
      const meta = document.createElement("meta")
      meta.name = "theme-color"
      meta.content = theme === "light" ? "#f4f6f9" : "#0b0f16"
      document.head.appendChild(meta)
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
    // Guards the iframe_api race: if the YT script finishes before the app
    // module, onYouTubeIframeAPIReady fires before player.ts exists. The app
    // registers window._ytAppReady and checks _ytReadySeen (load-bearing).
    window._ytReadySeen = false
    window.onYouTubeIframeAPIReady = () => {
      window._ytReadySeen = true
      if (window._ytAppReady) window._ytAppReady()
    }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
