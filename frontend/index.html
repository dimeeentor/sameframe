<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Sameframe</title>
    <script>
      // Pre-paint theme (must mirror settings.svelte.ts): explicit choice wins,
      // else system preference. Prevents a light flash in dark mode.
      {
        const t = localStorage.getItem("sameframe-theme")
        const theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.palette =
          localStorage.getItem("sameframe-palette") || "raspberry"
        try {
          const c = JSON.parse(localStorage.getItem("sameframe-custom") || "{}")
          const st = document.documentElement.style
          for (const k of ["hue", "chroma", "tint", "k"]) if (Number.isFinite(c[k])) st.setProperty("--custom-" + k, c[k])
          // Exact colours; mirrors the effect in settings.svelte.ts and inkFor in color.ts.
          const ok = (v) => Array.isArray(v) && v.length === 3 && v.every((n) => Number.isInteger(n) && n >= 0 && n <= 255)
          const rgb = (v) => "rgb(" + v.join(" ") + ")"
          const lum = (v) =>
            v
              .map((n) => ((n /= 255) <= 0.04045 ? n / 12.92 : ((n + 0.055) / 1.055) ** 2.4))
              .reduce((sum, n, i) => sum + n * [0.2126, 0.7152, 0.0722][i], 0)
          // 0.0061 is the luminance of the dark ink, rgb(24 16 18).
          const ink = (v) => (1.05 / (lum(v) + 0.05) >= (lum(v) + 0.05) / 0.0561 ? "rgb(255 255 255)" : "rgb(24 16 18)")
          for (const [mode, sfx] of [["light", ""], ["dark", "-d"]]) {
            const e = c.exact && c.exact[mode]
            if (!e) continue
            if (ok(e.accent)) {
              st.setProperty("--custom-accent" + sfx, rgb(e.accent))
              st.setProperty("--custom-ink" + sfx, ink(e.accent))
            }
            if (ok(e.page)) st.setProperty("--custom-page" + sfx, rgb(e.page))
          }
        } catch {}
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Guards the iframe_api race: if the YT script finishes before the app
      // module, onYouTubeIframeAPIReady fires before player.ts exists. The app
      // registers window._ytAppReady and checks _ytReadySeen (load-bearing).
      window._ytReadySeen = false
      window.onYouTubeIframeAPIReady = () => {
        window._ytReadySeen = true
        if (window._ytAppReady) window._ytAppReady()
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
