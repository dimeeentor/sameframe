<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Sameframe</title>
    <script>
      // Pre-paint theme (must mirror settings.svelte.ts): explicit choice wins,
      // else system preference. Prevents a light flash in dark mode.
      {
        const t = localStorage.getItem("sameframe-theme")
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Guards the iframe_api race: if the YT script finishes before the app
      // module, onYouTubeIframeAPIReady fires before player.ts exists. The app
      // registers window._ytAppReady and checks _ytReadySeen (load-bearing).
      window._ytSyncLogs = []
      window._ytLog = (...a) => {
        console.log("[sameframe]", ...a)
        window._ytSyncLogs.push(a.join(" "))
      }
      window._ytLog("page load", location.href, "host", location.host)
      window._ytReadySeen = false
      window.onYouTubeIframeAPIReady = () => {
        window._ytReadySeen = true
        window._ytLog("YT API ready (inline stub), YT defined?", typeof YT !== "undefined")
        if (window._ytAppReady) window._ytAppReady()
      }
      window.addEventListener("error", (e) =>
        window._ytLog("window error", e.message, e.filename),
      )
    </script>
    <script
      src="https://www.youtube.com/iframe_api"
      onerror="window._ytLog('YT iframe_api load error')"
      onload="window._ytLog('YT iframe_api script loaded')"
    ></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
