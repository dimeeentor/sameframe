<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Backdrop prototypes</title>
    <script>
      {
        const t = localStorage.getItem("sameframe-theme")
        document.documentElement.dataset.theme =
          t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/prototypes/main.ts"></script>
  </body>
</html>
